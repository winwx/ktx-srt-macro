name: Build KTX/SRT Macro

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build Windows executable
        run: |
          uv run pyinstaller --name KTX-SRT-Macro --onefile --windowed --icon "assets/favicon.ico" --add-data "src;src" --add-data "assets;assets" --noupx main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTX-SRT-Macro-Windows
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build macOS app
        run: |
          uv run pyinstaller --name KTX-SRT-Macro --onefile --windowed --icon "assets/favicon.icns" --add-data "src:src" --add-data "assets:assets" main.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTX-SRT-Macro-macOS
          path: dist/

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: KTX-SRT-Macro-Windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: KTX-SRT-Macro-macOS
          path: artifacts/macos

      - name: Package macOS app
        run: |
          cd artifacts/macos
          zip -r ../KTX-SRT-Macro-macOS.zip KTX-SRT-Macro.app

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/windows/KTX-SRT-Macro.exe \
            artifacts/KTX-SRT-Macro-macOS.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
